<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>골프 다이어리</title>
  <style>
    :root {
      --primary: #15803d;
      --primary-light: #dcfce7;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-sub: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", Pretendard, Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 70px; }

    /* 헤더 */
    .header { padding: 16px 20px 8px; display: flex; justify-content: space-between; align-items: center; }
    .header-title { font-size: 20px; font-weight: 800; color: var(--primary); }
    .header-actions { display: flex; gap: 6px; }
    .btn { padding: 7px 11px; border-radius: 8px; font-size: 13px; font-weight: 700; border: none; cursor: pointer; }
    .btn-outline { background: #f0fdf4; color: var(--primary); border: 1px solid #bbf7d0; }
    .btn-reset { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; } /* 초기화 버튼 */
    .btn-sub { background: #f1f5f9; color: #475569; }
    .btn-save { background: #ffe4e6; color: #e11d48; }

    /* 라운드 요약 카드 */
    .meta-bar { padding: 8px 20px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; color: #334155; }
    .stat-container {
      background: var(--card-bg); margin: 6px 16px 12px; border-radius: 12px;
      padding: 14px 12px; display: grid; grid-template-columns: repeat(4, 1fr);
      text-align: center; border: 1px solid var(--border);
    }
    .stat-item .title { font-size: 11px; color: var(--text-sub); margin-bottom: 4px; }
    .stat-item .val { font-size: 15px; font-weight: 800; }
    .stat-green { color: var(--primary); }

    /* 홀 네비게이션 스크롤 바 */
    .hole-scroller {
      display: flex; gap: 6px; overflow-x: auto; padding: 6px 16px 12px;
      scrollbar-width: none;
    }
    .hole-scroller::-webkit-scrollbar { display: none; }
    .hole-tab {
      flex: 0 0 38px; height: 42px; border-radius: 8px; background: #fff;
      border: 1px solid var(--border); display: flex; flex-direction: column;
      align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
      cursor: pointer;
    }
    .hole-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .hole-tab .dot { width: 4px; height: 4px; border-radius: 50%; background: #94a3b8; margin-top: 3px; }
    .hole-tab.active .dot { background: #fff; }

    /* 홀 입력 카드 */
    .card {
      background: var(--card-bg); margin: 0 16px 16px; border-radius: 16px;
      border: 1px solid var(--border); padding: 18px 16px;
    }
    .hole-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .hole-name { font-size: 22px; font-weight: 800; }
    .hole-badges { display: flex; gap: 6px; align-items: center; }
    .badge-dist { font-size: 12px; color: var(--text-sub); background: #f1f5f9; padding: 4px 8px; border-radius: 6px; }
    .badge-par { font-size: 12px; font-weight: 800; color: var(--primary); background: #dcfce7; padding: 4px 8px; border-radius: 6px; }

    /* 레귤러 온 알림 바 */
    .gir-banner {
      background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px;
      padding: 10px 12px; display: flex; justify-content: space-between;
      align-items: center; font-size: 12px; margin-bottom: 20px; font-weight: 600;
    }
    .gir-banner.fail { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
    .gir-banner.success { color: var(--primary); }

    /* 타수 증감 컨트롤 */
    .score-title { text-align: center; font-size: 13px; color: var(--text-sub); margin-bottom: 8px; }
    .counter-row { display: flex; align-items: center; justify-content: center; gap: 24px; margin-bottom: 16px; }
    .btn-circle {
      width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border);
      background: #fff; font-size: 20px; font-weight: 700; cursor: pointer;
    }
    .score-val { font-size: 38px; font-weight: 900; min-width: 50px; text-align: center; }

    /* 스코어 바로가기 버튼 */
    .score-quick-btns {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 20px;
    }
    .quick-btn {
      padding: 8px 4px; font-size: 12px; font-weight: 600; background: #fff;
      border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
    }
    .quick-btn.active { border-color: var(--primary); color: var(--primary); background: #f0fdf4; }

    /* 퍼트 / 벌타 서브 컨트롤 */
    .sub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .sub-box {
      border: 1px solid var(--border); border-radius: 12px; padding: 12px 10px;
      text-align: center; background: #f8fafc;
    }
    .sub-title { font-size: 11px; font-weight: 700; color: var(--text-sub); margin-bottom: 8px; }
    .sub-ctrl { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .sub-btn { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--border); background: #fff; font-weight: 700; cursor: pointer; }
    .sub-val { font-size: 18px; font-weight: 800; min-width: 20px; }

    /* 하단 탭 내비게이션 */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 56px;
      background: #fff; border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; align-items: center;
    }
    .nav-item { font-size: 11px; font-weight: 600; color: var(--text-sub); text-align: center; text-decoration: none; }
    .nav-item.active { color: var(--primary); }
  </style>
</head>
<body>

  <!-- 상단 헤더 -->
  <header class="header">
    <h1 class="header-title">새 라운딩 기록</h1>
    <div class="header-actions">
      <button class="btn btn-outline" onclick="loadDefaultCourse()">코스 불러오기</button>
      <button class="btn btn-reset" onclick="resetRound(true)">초기화</button>
      <button class="btn btn-sub" onclick="alert('동반자 설정')">정보/동반자</button>
      <button class="btn btn-save" onclick="saveData()">저장</button>
    </div>
  </header>

  <!-- 메타 정보 -->
  <div class="meta-bar">
    <span id="courseName">📍 기본 골프장 - 표준 18홀</span>
    <span>전체 6235m</span>
  </div>

  <!-- 통계 요약 (총 타수, 퍼트, GIR, 벌타) -->
  <section class="stat-container">
    <div class="stat-item">
      <div class="title">총 타수</div>
      <div class="val" id="totalScore">72 (E)</div>
    </div>
    <div class="stat-item">
      <div class="title">퍼트</div>
      <div class="val" id="totalPutts">36</div>
    </div>
    <div class="stat-item">
      <div class="title">레귤러 ON</div>
      <div class="val stat-green" id="totalGir">18/18 (100%)</div>
    </div>
    <div class="stat-item">
      <div class="title">벌타(OB/해)</div>
      <div class="val" id="totalPenalty">0 / 0</div>
    </div>
  </section>

  <!-- 홀 번호 선택 바 (1~18) -->
  <nav class="hole-scroller" id="holeTabs"></nav>

  <!-- 현재 홀 입력 카드 -->
  <main class="card">
    <div class="hole-header">
      <div class="hole-name" id="holeNumberText">1번 홀</div>
      <div class="hole-badges">
        <span class="badge-dist" id="holeDistText">360m</span>
        <span class="badge-par" id="holeParText">PAR 4 ↺</span>
      </div>
    </div>

    <!-- 레귤러 ON 판정 배너 -->
    <div class="gir-banner success" id="girBanner">
      <span id="girStatusText">🟢 레귤러 ON (2온 성공)</span>
      <span id="girSubText">기준 2타 이내 그린 안착 (퍼트 2팟)</span>
    </div>

    <!-- 최종 타수 컨트롤 -->
    <div class="score-title">홀 최종 타수 (Score)</div>
    <div class="counter-row">
      <button class="btn-circle" onclick="adjustScore(-1)">-</button>
      <span class="score-val" id="holeScoreVal">4</span>
      <button class="btn-circle" onclick="adjustScore(1)">+</button>
    </div>

    <!-- 퀵 스코어 버튼 -->
    <div class="score-quick-btns" id="quickBtns"></div>

    <!-- 퍼트 수 & 벌타 -->
    <div class="sub-grid">
      <div class="sub-box">
        <div class="sub-title">퍼트 수 (Putts)</div>
        <div class="sub-ctrl">
          <button class="sub-btn" onclick="adjustPutts(-1)">-</button>
          <span class="sub-val" id="holePuttsVal">2</span>
          <button class="sub-btn" onclick="adjustPutts(1)">+</button>
        </div>
      </div>
      <div class="sub-box">
        <div class="sub-title">벌타 (터치 +1 / 길게 0)</div>
        <div class="sub-ctrl">
          <button class="sub-btn" onclick="adjustPenalty(-1)">-</button>
          <span class="sub-val" id="holePenaltyVal">0</span>
          <button class="sub-btn" onclick="adjustPenalty(1)">+</button>
        </div>
      </div>
    </div>
  </main>

  <!-- 하단 탭 내비게이션 -->
  <footer class="bottom-nav">
    <a href="#" class="nav-item active">⛳<br>새 라운딩</a>
    <a href="#" class="nav-item">📋<br>기록보관함</a>
    <a href="#" class="nav-item">📊<br>통계</a>
    <a href="#" class="nav-item">⚙️<br>코스 관리</a>
  </footer>

  <script>
    // 18개 홀 표준 데이터 (파4: 10개, 파3: 4개, 파5: 4개 = 파 72)
    const defaultPars = [4, 4, 3, 5, 4, 4, 3, 4, 5, 4, 4, 3, 5, 4, 4, 3, 4, 5];
    const defaultDists = [360, 340, 150, 480, 370, 350, 140, 390, 500, 380, 360, 160, 490, 370, 350, 130, 400, 510];

    let currentHoleIdx = 0;
    let holes = [];

    // 스코어 완전 초기화 함수 (이븐파, 2퍼트, 0벌타, 1번홀 세팅)
    function resetRound(showConfirm = false) {
      if (showConfirm && !confirm("모든 홀의 스코어를 이븐파(2퍼트, 벌타 0) 기준으로 초기화할까요?")) {
        return;
      }
      holes = defaultPars.map((par, i) => ({
        holeNum: i + 1,
        par: par,
        dist: defaultDists[i],
        score: par,     // 이븐파 기준
        putts: 2,       // 기본 2퍼트
        penalty: 0      // 기본 벌타 0
      }));

      currentHoleIdx = 0; // 1번 홀로 이동
      renderTabs();
      renderCurrentHole();
      calculateTotals();
    }

    // 코스 불러오기 시 초기화 연동
    function loadDefaultCourse() {
      alert("기본 골프장 코스를 불러왔습니다. 스코어가 이븐파 기준으로 초기화됩니다.");
      resetRound(false);
    }

    // 타수 변경
    function adjustScore(delta) {
      const h = holes[currentHoleIdx];
      if (h.score + delta >= 1) {
        h.score += delta;
        renderCurrentHole();
        calculateTotals();
      }
    }

    // 퍼트 변경
    function adjustPutts(delta) {
      const h = holes[currentHoleIdx];
      if (h.putts + delta >= 0 && h.putts + delta <= h.score) {
        h.putts += delta;
        renderCurrentHole();
        calculateTotals();
      }
    }

    // 벌타 변경
    function adjustPenalty(delta) {
      const h = holes[currentHoleIdx];
      if (h.penalty + delta >= 0) {
        h.penalty += delta;
        renderCurrentHole();
        calculateTotals();
      }
    }

    // 퀵 버튼으로 스코어 선택
    function setQuickScore(score) {
      holes[currentHoleIdx].score = score;
      renderCurrentHole();
      calculateTotals();
    }

    // 홀 UI 렌더링
    function renderCurrentHole() {
      const h = holes[currentHoleIdx];
      document.getElementById('holeNumberText').textContent = `${h.holeNum}번 홀`;
      document.getElementById('holeDistText').textContent = `${h.dist}m`;
      document.getElementById('holeParText').textContent = `PAR ${h.par} ↺`;
      document.getElementById('holeScoreVal').textContent = h.score;
      document.getElementById('holePuttsVal').textContent = h.putts;
      document.getElementById('holePenaltyVal').textContent = h.penalty;

      // GIR(레귤러 온) 계산: 그린 적중 타수 = 전체 타수 - 퍼트 수 <= 파 - 2
      const onGreenStrokes = h.score - h.putts;
      const girTarget = h.par - 2;
      const isGir = onGreenStrokes <= girTarget;

      const girBanner = document.getElementById('girBanner');
      const girStatusText = document.getElementById('girStatusText');
      const girSubText = document.getElementById('girSubText');

      if (isGir) {
        girBanner.className = 'gir-banner success';
        girStatusText.textContent = `🟢 레귤러 ON (${onGreenStrokes}온 성공)`;
        girSubText.textContent = `기준 ${girTarget}타 이내 그린 안착 (퍼트 ${h.putts}팟)`;
      } else {
        girBanner.className = 'gir-banner fail';
        girStatusText.textContent = `🔴 레귤러 ON 실패 (${onGreenStrokes}온)`;
        girSubText.textContent = `기준 ${girTarget}타 초과 안착`;
      }

      // 퀵 버튼 목록 렌더링
      const quickContainer = document.getElementById('quickBtns');
      const diffMap = [
        { name: "이글", diff: -2 },
        { name: "버디", diff: -1 },
        { name: "파", diff: 0 },
        { name: "보기", diff: 1 },
        { name: "더블", diff: 2 },
        { name: "트리플", diff: 3 }
      ];

      quickContainer.innerHTML = diffMap.map(item => {
        const targetScore = h.par + item.diff;
        const isActive = (h.score === targetScore);
        return `<button class="quick-btn ${isActive ? 'active' : ''}" onclick="setQuickScore(${targetScore})">${item.name} (${targetScore})</button>`;
      }).join('');
    }

    // 상단 1~18번 홀 탭 렌더링
    function renderTabs() {
      const container = document.getElementById('holeTabs');
      container.innerHTML = holes.map((h, i) => `
        <div class="hole-tab ${i === currentHoleIdx ? 'active' : ''}" onclick="selectHole(${i})">
          <span>${h.holeNum}</span>
          <div class="dot"></div>
        </div>
      `).join('');
    }

    function selectHole(idx) {
      currentHoleIdx = idx;
      renderTabs();
      renderCurrentHole();
    }

    // 상단 요약 통계 계산
    function calculateTotals() {
      let totalScore = 0;
      let totalPar = 0;
      let totalPutts = 0;
      let totalPenalty = 0;
      let girCount = 0;

      holes.forEach(h => {
        totalScore += h.score;
        totalPar += h.par;
        totalPutts += h.putts;
        totalPenalty += h.penalty;
        if ((h.score - h.putts) <= (h.par - 2)) {
          girCount++;
        }
      });

      const diff = totalScore - totalPar;
      const scoreStr = diff === 0 ? `${totalScore} (E)` : (diff > 0 ? `${totalScore} (+${diff})` : `${totalScore} (${diff})`);

      document.getElementById('totalScore').textContent = scoreStr;
      document.getElementById('totalPutts').textContent = totalPutts;
      document.getElementById('totalGir').textContent = `${girCount}/18 (${Math.round((girCount / 18) * 100)}%)`;
      document.getElementById('totalPenalty').textContent = `${totalPenalty} / 0`;
    }

    function saveData() {
      alert("라운딩 데이터가 저장되었습니다.");
    }

    // 페이지 로드 시 초기 실행
    window.onload = () => {
      resetRound(false);
    };
  </script>
</body>
</html>
